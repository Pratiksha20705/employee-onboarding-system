spring.application.name=onboardflow-backend

# All values below fall back to a local-dev-only default when the
# corresponding environment variable isn't set. Never rely on these
# defaults outside of local development — set real values via env vars
# (see backend/.env.example) for any shared or deployed environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/onboardflow_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Pratiksha}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# JWT_SECRET must be overridden with a long, random value outside local dev.
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-do-not-use-in-production-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Candidate document uploads: stored on the server filesystem (relative to the
# backend's working directory unless an absolute path is given); only the
# generated stored file name + this base directory are ever used to resolve a
# file on disk, so a document ID never resolves to an arbitrary path.
app.upload.dir=${UPLOAD_DIR:uploads/documents}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:5MB}

# Seeded HR account (created once, on first boot, if it doesn't exist yet)
app.seed.hr-email=${APP_SEED_HR_EMAIL:hr@onboardflow.com}
app.seed.hr-password=${APP_SEED_HR_PASSWORD:Hr@12345}

# Seeded demo candidate account + onboarding profile (created once, on first boot, if it doesn't exist yet)
app.seed.candidate-email=${APP_SEED_CANDIDATE_EMAIL:candidate@onboardflow.com}
app.seed.candidate-password=${APP_SEED_CANDIDATE_PASSWORD:Candidate@12345}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
